name: Scheduled vulncheck

# Catches newly published advisories and released fixes without code changes.
# Kept separate from CI so an external advisory doesn't turn the CI badge red.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # Accepted advisories are listed in the Makefile (VULNCHECK_ACCEPTED / VULNCHECK_UNTIL_FIXED).
      - run: make vulncheck
